name: Mockup
on:
  push:
    branches: ["lighthouse/mockup"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i --no-save --no-package-lock playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node ops/mockup.mjs
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          mv mockups /tmp/mockups
          git fetch origin lighthouse-results --depth=1 && git checkout -B lighthouse-results FETCH_HEAD
          rm -rf mockups && cp -r /tmp/mockups mockups && git add mockups && git commit -qm "Contrast mockups" && git push -q origin lighthouse-results
